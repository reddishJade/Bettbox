name: Windows rolling build

on:
  workflow_dispatch:

concurrency:
  group: windows-rolling-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN || vars.IPINFO_TOKEN }}

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: git config --global core.longpaths true
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.x
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Use hosted Linux plugin on Windows
        shell: pwsh
        run: |
          $pubspec = Get-Content pubspec.yaml -Raw
          $pubspec = $pubspec -replace '(?m)^  # Fix compile failure:.*\r?\n  hotkey_manager_linux:\r?\n    git:\r?\n      url: https://github.com/gepbird/hotkey_manager.git\r?\n      path: packages/hotkey_manager_linux\r?\n      ref: fix-build-failure\r?\n', ''
          Set-Content pubspec.yaml $pubspec -NoNewline
      - name: Build core
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart windows --arch amd64 --out core-only
      - name: Build helper service
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          dart setup.dart windows --arch amd64 --out helper --core-hash $coreHash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build application
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $coreHash = (Get-FileHash libclash/windows/BettboxCore.exe -Algorithm SHA256).Hash.ToLower()
          $flutterArgs = @(
            'build', 'windows', '--release', '--verbose',
            "--dart-define=CORE_SHA256=$coreHash",
            '--dart-define=APP_ENV=pre',
            '--dart-define=APP_ASSET_SUFFIX=windows-amd64-setup.exe'
          )
          if ($env:SENTRY_DSN) { $flutterArgs += "--dart-define=SENTRY_DSN=$env:SENTRY_DSN" }
          if ($env:IPINFO_TOKEN) { $flutterArgs += "--dart-define=IPINFO_TOKEN=$env:IPINFO_TOKEN" }
          flutter @flutterArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and portable build
        shell: bash
        run: dart windows/packaging/exe/package_windows.dart --arch amd64 --portable --env pre
      - uses: actions/upload-artifact@v7
        with:
          name: Bettbox-windows-amd64-rolling
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Bettbox-windows-amd64-rolling
          path: dist
      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist/*-windows-amd64-setup.exe)
          portable=(dist/*-windows-amd64-portable.zip)
          if [[ ${#installers[@]} -ne 1 || ${#portable[@]} -ne 1 ]]; then
            echo 'Expected one Windows x64 installer and one portable archive' >&2
            exit 1
          fi
          {
            printf 'Windows x64 rolling build from commit `%s`.\n\n' "$GITHUB_SHA"
            printf '%s\n' '- Download the setup executable or portable ZIP.' '- These binaries are unsigned.' '' 'SHA-256:' '```'
            (cd dist && sha256sum "$(basename "${portable[0]}")" "$(basename "${installers[0]}")")
            printf '%s\n' '```'
          } > release-notes.md
          gh release upload rolling "${installers[0]}" "${portable[0]}" --clobber
          old_sha=$(git ls-remote origin refs/tags/rolling | cut -f1)
          test -n "$old_sha"
          git push origin --force-with-lease="refs/tags/rolling:$old_sha" "$GITHUB_SHA:refs/tags/rolling"
          gh release edit rolling --target "$GITHUB_SHA" --notes-file release-notes.md --prerelease --latest=false
