name: Flutter tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test (empty uses this workflow's commit)
        type: string
        required: false
      tests:
        description: Space-separated test files or directories
        type: string
        required: true
        default: test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record the tested commit
        run: |
          git rev-parse HEAD
          printf 'Tested commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Dart code
        run: dart run build_runner build

      - name: Build the editor's native test library
        working-directory: plugins/code_forge/rust
        run: cargo build --release --locked

      - name: Run the selected tests
        env:
          TEST_PATHS: ${{ inputs.tests }}
        run: |
          read -r -a test_paths <<< "$TEST_PATHS"
          flutter test --reporter expanded "${test_paths[@]}"
